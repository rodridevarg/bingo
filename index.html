<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bingo TV</title>
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body class="theme-default">
  <!-- Canvas para efecto confetti -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Contenedor principal -->
  <div id="app">
    <!-- Header: bola y número actual -->
    <div class="logo-wrapper">
      <img src="logo.png" alt="ShareDance" class="logo">
    </div>

    <div id="main-view">
      <header class="main-header">
        <div class="ball-container">
          <!-- Bolillero animado -->
          <div id="drum" class="drum hidden">
            <span id="drum-number" class="drum-number">--</span>
            <div class="drum-inner">
              <div class="drum-ball"></div>
              <div class="drum-ball"></div>
              <div class="drum-ball"></div>
              <div class="drum-ball"></div>
              <div class="drum-ball"></div>
              <div class="drum-ball"></div>
              <div class="drum-ball"></div>
              <div class="drum-ball"></div>
            </div>
          </div>
          <div id="current-ball" class="bingo-ball">
            <span id="ball-number" class="ball-number">--</span>
          </div>
        </div>
      </header>

      <!-- Main: historial de bolas sorteadas -->
      <main class="history-section">
        <h2 id="history-title" class="history-title hidden">Últimas bolas</h2>
        <div id="history-grid" class="history-grid">
          <!-- Se llena dinámicamente -->
        </div>
      </main>
    </div>

    <!-- Vista del tablero completo (90 números) -->
    <div id="board-view" class="hidden">
      <div class="board-header">
        <h2 class="board-title">Cartón Bingo</h2>
        <button id="btn-close-board" class="btn-close-board" type="button">✕ Volver</button>
      </div>
      <div id="board-grid" class="board-grid">
        <!-- Se genera dinámicamente 1-90 -->
      </div>
    </div>

    <!-- Footer: controles -->
    <footer class="controls-section">
      <div class="counter-box">
        <span class="counter-label">Bolas restantes</span>
        <span id="balls-remaining" class="counter-value">90</span>
      </div>
      <button id="btn-draw" class="btn-draw" type="button">Sacar Bola</button>
      <div class="side-controls">
        <div class="theme-selector" title="Cambiar tema">
          <button class="theme-btn theme-default" data-theme="theme-default" type="button"></button>
          <button class="theme-btn theme-gold" data-theme="theme-gold" type="button"></button>
          <button class="theme-btn theme-neon" data-theme="theme-neon" type="button"></button>
          <button id="btn-mute" class="btn-mute" type="button" title="Silenciar">🔊</button>
        </div>
        <div class="side-row">
          <button id="btn-board" class="btn-board" type="button">📋 Tablero</button>
          <button id="btn-undo" class="btn-undo" type="button" disabled>↩️ Deshacer</button>
          <button id="btn-new-game" class="btn-new-game" type="button">Nueva Partida</button>
        </div>
        <div class="side-row">
          <button id="btn-save" class="btn-save" type="button">💾 Guardar</button>
          <button id="btn-load" class="btn-load" type="button">📂 Cargar</button>
          <input type="file" id="file-load" class="hidden" accept=".json">
        </div>
        <!-- Guía de atajos -->
        <div id="shortcuts-hint" class="shortcuts-hint">
          <span><kbd>Espacio</kbd> Sacar</span>
          <span><kbd>T</kbd> Tablero</span>
          <span><kbd>F</kbd> Pantalla completa</span>
          <span><kbd>U</kbd> Deshacer</span>
          <span><kbd>N</kbd> Nueva</span>
        </div>
      </div>
    </footer>

    <!-- Indicador de estado -->
    <div id="status-message" class="status-message"></div>
  </div>

  <!-- Modal de confirmación -->
  <div id="modal-confirm" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <h3 id="modal-title">¿Nueva partida?</h3>
      <p id="modal-text">Se borrará todo el progreso actual. Esta acción no se puede deshacer.</p>
      <div class="modal-actions">
        <button id="btn-cancel" class="btn-cancel" type="button">Cancelar</button>
        <button id="btn-confirm" class="btn-confirm" type="button">Confirmar</button>
      </div>
    </div>
  </div>

  <script src="app.js?v=7"></script>
</body>
</html>
